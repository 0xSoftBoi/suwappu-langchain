name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Require a matching version tag
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Install dependencies
        run: npm ci
      - name: Verify publish artifact
        run: npm run verify
      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          # npm trusted publishing uses OIDC first; this preserves a scoped-token fallback.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
